upstream shorner_backend {
    # Docker Compose DNS resolves "web" to all replicas.
    # least_conn sends each new request to the server with the fewest active connections.
    least_conn;
    server web:8080;
}

server {
    listen 80;
    server_name _;

    # Proxy headers — forward real client info to the Go servers.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts.
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    location / {
        proxy_pass http://shorner_backend;
    }

    # Health check for the load balancer itself.
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
